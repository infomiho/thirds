<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG image</title>
  <style>
    body { margin: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #og { width: 1200px; height: 630px; background: #000; color: #fff; display: flex; align-items: center; padding: 0 72px; box-sizing: border-box; gap: 48px; }
    .copy { flex: 1; display: grid; gap: 28px; }
    .wordmark { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; }
    .wordmark svg { width: 40px; height: 40px; }
    h1 { margin: 0; font-size: 56px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 700; }
    p { margin: 0; font-size: 24px; line-height: 1.4; color: #a1a8ae; }
    .strips { display: flex; gap: 6px; }
    .strip { width: 156px; height: 420px; border-radius: 14px; overflow: hidden; border: 1px solid #2f3336; }
    .strip img { display: block; width: 480px; height: 420px; object-fit: cover; }
    .strip:nth-child(2) img { margin-left: -162px; }
    .strip:nth-child(3) img { margin-left: -324px; }
  </style>
</head>
<body>
  <div id="og">
    <div class="copy">
      <div class="wordmark">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1d9bf0"/><rect x="7" y="9" width="5" height="14" rx="1.5" fill="#fff"/><rect x="13.5" y="9" width="5" height="14" rx="1.5" fill="#fff"/><rect x="20" y="9" width="5" height="14" rx="1.5" fill="#fff"/></svg>
        Thirds
      </div>
      <h1>One screenshot. Three images. One seamless X carousel.</h1>
      <p>Split a wide screenshot into thirds, right in your browser.</p>
    </div>
    <div class="strips">
      <div class="strip"><img src="scene.svg" alt=""></div>
      <div class="strip"><img src="scene.svg" alt=""></div>
      <div class="strip"><img src="scene.svg" alt=""></div>
    </div>
  </div>
</body>
</html>
